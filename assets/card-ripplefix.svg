<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 170" width="440" height="170" role="img" aria-label="RippleFix">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071330"/><stop offset="1" stop-color="#030712"/></linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.3"/></linearGradient>
    <radialGradient id="gl" cx="0.1" cy="0.1" r="0.6"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <style>.in{animation:in .8s 0.00s ease-out both}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style>
  </defs>
  <g class="in">
    <rect x="1" y="1" width="438" height="168" rx="16" fill="url(#bg)"/>
    <rect x="1" y="1" width="438" height="168" rx="16" fill="url(#gl)"/>
    <rect x="1" y="1" width="438" height="168" rx="16" fill="none" stroke="url(#bd)" stroke-width="2"/>
    <rect x="22" y="22" width="44" height="44" rx="12" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="44" y="53" text-anchor="middle" font-size="24">🌊</text>
    <text x="80" y="51" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#f8fafc">RippleFix</text>
    <rect x="326" y="28" width="92" height="22" rx="11" fill="none" stroke="#22d3ee" stroke-opacity="0.8"/>
    <text x="372" y="43" text-anchor="middle" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="11" fill="#22d3ee">público ↗</text>
    <text font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" fill="#bfdbfe"><tspan x="22" y="94">Análisis de impacto determinista: cambia el código</tspan><tspan x="22" y="114">una vez y sigue sus consecuencias por todo el stack.</tspan></text>
    <g font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="12" font-weight="700" fill="#93c5fd">
      <rect x="22" y="132" width="52" height="22" rx="11" fill="#3b82f6" fill-opacity="0.14"/><text x="48" y="147" text-anchor="middle">Rust</text>
      <rect x="82.4" y="132" width="106" height="22" rx="11" fill="#3b82f6" fill-opacity="0.14"/><text x="135" y="147" text-anchor="middle">tree-sitter</text>
      <rect x="196.0" y="132" width="75" height="22" rx="11" fill="#3b82f6" fill-opacity="0.14"/><text x="234" y="147" text-anchor="middle">FastAPI</text>
    </g>
  </g>
</svg>
