<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="LizasoDev — Full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030712"/><stop offset="0.55" stop-color="#071330"/><stop offset="1" stop-color="#0b2257"/></linearGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.6"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="petal" cx="0.5" cy="0.75" r="0.8"><stop offset="0" stop-color="#93c5fd"/><stop offset="0.6" stop-color="#2563eb"/><stop offset="1" stop-color="#172554"/></radialGradient>
    <radialGradient id="petalIn" cx="0.5" cy="0.7" r="0.7"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#1e3a8a"/></radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#bfdbfe"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#60a5fa" stroke-opacity="0.07"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="frame"><rect width="1200" height="260" rx="20"/></clipPath>
    <clipPath id="txt"><text x="330" y="140" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="92" font-weight="900" letter-spacing="-2.5">LizasoDev</text></clipPath>
    <style>
      .pulse{animation:pulse 5s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      .sway{animation:sway 6s ease-in-out infinite;transform-origin:230px 370px}
      @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
      .bloom{animation:bloom 4s ease-in-out infinite;transform-origin:230px 135px}
      @keyframes bloom{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
      .sweep{animation:sweep 4.5s ease-in-out infinite}
      @keyframes sweep{0%{transform:translateX(-300px) skewX(-20deg)}55%,100%{transform:translateX(800px) skewX(-20deg)}}
      .fall{animation:fall linear infinite}
      @keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:1}100%{transform:translate(170px,170px) rotate(360deg);opacity:0}}
      .rise{animation:rise linear infinite}
      @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-200px);opacity:0}}
      .in1{animation:in .9s ease-out both} .in2{animation:in .9s .3s ease-out both} .in3{animation:in .9s .6s ease-out both}
      @keyframes in{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
      .blink{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <ellipse class="pulse" cx="172" cy="100" rx="190" ry="150" fill="url(#glowR)"/>
    <ellipse class="pulse" cx="1080" cy="240" rx="300" ry="160" fill="url(#glowC)" style="animation-delay:2.5s"/>
    <g fill="#7dd3fc">
      <circle class="rise" cx="560" cy="270" r="2" style="animation-duration:7s"/>
      <circle class="rise" cx="760" cy="270" r="2.5" style="animation-duration:9s;animation-delay:2s"/>
      <circle class="rise" cx="930" cy="270" r="1.8" style="animation-duration:8s;animation-delay:1s"/>
      <circle class="rise" cx="1060" cy="270" r="2.5" style="animation-duration:10s;animation-delay:3s"/>
      <circle class="rise" cx="1150" cy="270" r="1.5" style="animation-duration:7.5s;animation-delay:4s"/>
    </g>
    <g transform="translate(30 8) scale(0.62)">
          <!-- ROSA -->
    <g class="sway">
