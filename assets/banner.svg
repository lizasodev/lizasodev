      <path d="M232 200 C 226 250, 244 300, 230 380" fill="none" stroke="url(#stem)" stroke-width="9" stroke-linecap="round"/>
      <path d="M233 255 l-12 -6 M228 300 l13 -6 M235 340 l-12 -5" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
      <!-- hojas -->
      <path d="M232 270 C 180 250, 150 270, 132 300 C 175 312, 210 300, 232 270 Z" fill="#14b8a6"/>
      <path d="M232 270 C 195 282, 165 292, 132 300" stroke="#0f766e" stroke-width="2" fill="none"/>
      <path d="M230 230 C 280 205, 318 220, 336 250 C 292 266, 252 258, 230 230 Z" fill="#2dd4bf"/>
      <path d="M230 230 C 268 240, 300 246, 336 250" stroke="#0f766e" stroke-width="2" fill="none"/>
      <!-- sépalos -->
      <path d="M232 200 C 205 205, 190 196, 182 182 C 205 186, 222 190, 232 200 Z M232 200 C 258 205, 274 196, 282 182 C 258 186, 242 190, 232 200 Z" fill="#14b8a6"/>

      <!-- flor -->
      <g class="bloom">
        <ellipse cx="230" cy="135" rx="95" ry="80" fill="#3b82f6" opacity="0.35" filter="url(#soft)"/>
        <path d="M230 205 C 150 205, 128 150, 140 102 C 160 125, 190 140, 230 142 C 270 140, 300 125, 320 102 C 332 150, 310 205, 230 205 Z" fill="url(#petal)"/>
        <path d="M150 115 C 140 70, 180 45, 215 62 C 200 85, 190 115, 196 150 C 172 145, 156 132, 150 115 Z" fill="#1d4ed8"/>
        <path d="M310 115 C 320 70, 280 45, 245 62 C 260 85, 270 115, 264 150 C 288 145, 304 132, 310 115 Z" fill="#1e40af"/>
        <path d="M172 92 C 170 55, 205 38, 232 48 C 262 38, 292 58, 288 95 C 282 125, 258 140, 230 142 C 202 140, 178 124, 172 92 Z" fill="url(#petalIn)"/>
        <path d="M188 96 C 186 70, 212 58, 236 66 C 220 74, 206 92, 210 118 C 198 114, 190 106, 188 96 Z" fill="#3b82f6"/>
        <path d="M272 96 C 274 70, 250 56, 226 64 C 248 72, 260 92, 254 120 C 264 114, 270 106, 272 96 Z" fill="#1e40af"/>
        <path d="M206 98 C 206 78, 230 70, 248 80 C 256 96, 248 114, 232 120 C 216 118, 207 110, 206 98 Z" fill="#2563eb"/>
        <path d="M218 96 C 220 84, 238 80, 244 92 C 242 104, 230 108, 222 104" fill="none" stroke="#172554" stroke-width="5" stroke-linecap="round"/>
        <path d="M226 94 C 230 88, 238 90, 236 97" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M188 96 C 196 70, 220 60, 240 62" fill="none" stroke="#bfdbfe" stroke-width="2" opacity="0.7"/>
        <path d="M150 115 C 160 140, 190 150, 230 152" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
        <path d="M310 115 C 300 140, 270 150, 230 152" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
      </g>
    </g>

    
    </g>
    <g fill="#60a5fa">
      <path class="fall" style="animation-duration:7s" d="M190 100c6-8 16-5 15 4-2 8-10 10-15 4z"/>
      <path class="fall" style="animation-duration:9s;animation-delay:2.5s;fill:#1d4ed8" d="M150 110c6-8 16-5 15 4-2 8-10 10-15 4z"/>
      <path class="fall" style="animation-duration:8s;animation-delay:5s;fill:#93c5fd" d="M205 80c5-6 13-4 12 4-2 6-8 8-12 4z"/>
    </g>
    <text class="in1" x="333" y="62" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="16" letter-spacing="4" fill="#38bdf8">// FULL-STACK DEVELOPER</text>
    <g class="in2">
      <text x="330" y="140" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="92" font-weight="900" letter-spacing="-2.5" fill="#1d4ed8" opacity="0.55" transform="translate(4 5)">LizasoDev</text>
      <text x="330" y="140" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="92" font-weight="900" letter-spacing="-2.5" fill="url(#title)">LizasoDev</text>
      <g clip-path="url(#txt)"><rect class="sweep" x="300" y="50" width="120" height="110" fill="url(#shine)"/></g>
    </g>
    <rect x="333" y="160" width="520" height="2" fill="url(#line)"/>
    <g class="in3">
      <text x="333" y="196" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="19" fill="#dbeafe"><tspan fill="#38bdf8">❯</tspan> código que llega a producción · IA aplicada<tspan class="blink" fill="#38bdf8">█</tspan></text>
      <g font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="13" font-weight="700" fill="#93c5fd">
        <rect x="333" y="212" width="108" height="26" rx="13" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.7"/><text x="387" y="229" text-anchor="middle">TypeScript</text>
        <rect x="451.0" y="212" width="59" height="26" rx="13" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.7"/><text x="480" y="229" text-anchor="middle">Rust</text>
        <rect x="519.8" y="212" width="75" height="26" rx="13" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.7"/><text x="557" y="229" text-anchor="middle">Python</text>
        <rect x="605.0" y="212" width="67" height="26" rx="13" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.7"/><text x="638" y="229" text-anchor="middle">React</text>
        <rect x="682.0" y="212" width="83" height="26" rx="13" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.7"/><text x="724" y="229" text-anchor="middle">Node.js</text>
        <rect x="775.4" y="212" width="108" height="26" rx="13" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.7"/><text x="829" y="229" text-anchor="middle">Cloudflare</text>
      </g>
    </g>
    <path d="M1140 24 h36 v36" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <text x="1128" y="42" text-anchor="end" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="12" fill="#60a5fa" opacity="0.8">status: <tspan fill="#22d3ee">online</tspan></text>
    <rect x="1.5" y="1.5" width="1197" height="257" rx="19" fill="none" stroke="url(#border)" stroke-opacity="0.55" stroke-width="3"/>
  </g>
</svg>
